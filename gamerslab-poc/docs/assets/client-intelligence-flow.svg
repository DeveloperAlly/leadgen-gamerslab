<svg viewBox="0 0 920 820" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
<title>Client onboarding &amp; intelligence loop — end to end</title>
<desc>How a tenant's sources become the CAG brief that feeds the lead engine, with inputs and outputs per step.</desc>
<rect x="0" y="0" width="920" height="820" fill="#ffffff"/>
<style>
.t{fill:#1a1a1a;font-size:13px;font-weight:700;}
.s{fill:#555;font-size:10.5px;}
.io{fill:#444;font-size:10px;}
.mono{font-family:ui-monospace,monospace;fill:#555;font-size:9.5px;}
.box{fill:#eef4fb;stroke:#5b8def;stroke-width:1.6;}
.n8n{fill:#e9f7ee;stroke:#3fa66a;stroke-width:1.6;}
.flow{stroke:#9aa3ad;stroke-width:2;fill:none;}
.trig{stroke:#c98a2b;stroke-width:1.6;fill:none;stroke-dasharray:4 3;}
.hdL{fill:#3a7d44;font-size:11px;font-weight:700;}
.hdR{fill:#2d6aa3;font-size:11px;font-weight:700;}
</style>

<text x="24" y="28" class="t" font-size="15">CLIENT — onboarding &amp; intelligence loop (builds the CAG brief)</text>
<text x="24" y="46" class="s">Surface: UI = blue · n8n workflow = green. Solid = data flow · dashed amber = webhook trigger.</text>
<text x="40" y="70" class="hdL">INPUTS →</text>
<text x="640" y="70" class="hdR">→ OUTPUTS</text>

<rect x="320" y="82" width="280" height="64" rx="9" class="box"/>
<text x="335" y="106" class="t">1 · Add source</text>
<text x="335" y="124" class="s">UI Sources → `sources` Edge fn</text>
<text x="335" y="139" class="mono">file bytes → Supabase Storage</text>
<text x="305" y="108" class="io" text-anchor="end">URL, or</text>
<text x="305" y="122" class="io" text-anchor="end">uploaded doc (PDF)</text>
<text x="615" y="108" class="mono">source row (status=queued)</text>
<text x="615" y="122" class="mono">+ fires source-ingest webhook</text>

<rect x="320" y="190" width="280" height="78" rx="9" class="n8n"/>
<text x="335" y="214" class="t">2 · Source Ingestion ⑤</text>
<text x="335" y="231" class="s">fetch/download → strip/extract text</text>
<text x="335" y="246" class="s">→ LLM extract (free model)</text>
<text x="335" y="261" class="mono">JSON {answer, confidence, quote}</text>
<text x="305" y="214" class="io" text-anchor="end">queued source</text>
<text x="305" y="228" class="io" text-anchor="end">existing intake_answer</text>
<text x="305" y="242" class="io" text-anchor="end">OpenRouter free models</text>
<text x="615" y="220" class="mono">source_extract row</text>
<text x="615" y="234" class="mono">facts keyed to intake Qs</text>

<rect x="320" y="298" width="280" height="70" rx="9" class="n8n"/>
<text x="335" y="322" class="t">3 · Fill / suggest intake bank</text>
<text x="335" y="339" class="s">empty key → ADD · conflict → SUGGEST</text>
<text x="335" y="356" class="mono">single CTE upsert</text>
<text x="305" y="328" class="io" text-anchor="end">extracted facts</text>
<text x="615" y="322" class="mono">intake_answer (ADD)</text>
<text x="615" y="336" class="mono">intake_suggestion (SUGGEST)</text>
<text x="615" y="350" class="mono">source → indexed</text>

<rect x="320" y="398" width="280" height="68" rx="9" class="box"/>
<text x="335" y="422" class="t">4 · Human review</text>
<text x="335" y="439" class="s">UI Intake → `intake` Edge fn</text>
<text x="335" y="455" class="s">accept / dismiss suggestion · edit</text>
<text x="305" y="424" class="io" text-anchor="end">suggestions +</text>
<text x="305" y="438" class="io" text-anchor="end">current answers</text>
<text x="615" y="430" class="mono">confirmed intake_answer</text>
<text x="615" y="444" class="mono">(41-question bank)</text>

<rect x="320" y="496" width="280" height="72" rx="9" class="n8n"/>
<text x="335" y="520" class="t">5 · Context Builder ④</text>
<text x="335" y="537" class="s">compose deterministic CAG block</text>
<text x="335" y="553" class="mono">=== GAMERSLAB PRODUCT BRIEF ===</text>
<text x="305" y="526" class="io" text-anchor="end">all intake_answer</text>
<text x="305" y="540" class="io" text-anchor="end">keys (per tenant)</text>
<text x="615" y="526" class="mono">cag_context.cag_block</text>
<text x="615" y="540" class="mono">(latest kept, rest trimmed)</text>

<rect x="320" y="598" width="280" height="68" rx="9" class="box"/>
<text x="335" y="622" class="t">6 · Business Context (direct edit)</text>
<text x="335" y="639" class="s">UI → `context` Edge fn (GET/PUT)</text>
<text x="335" y="655" class="s">human edits the brief directly</text>
<text x="305" y="632" class="io" text-anchor="end">cag_context</text>
<text x="615" y="632" class="mono">cag_context (updated)</text>

<rect x="320" y="700" width="280" height="56" rx="9" fill="#f5f5f5" stroke="#c98a2b" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="335" y="724" class="t">→ feeds the LEAD engine</text>
<text x="335" y="741" class="s">read each run by `Apply CAG from DB` (see Leads diagram)</text>

<path class="flow" d="M460 146 V190" marker-end="url(#ar)"/>
<path class="flow" d="M460 268 V298" marker-end="url(#ar)"/>
<path class="flow" d="M460 368 V398" marker-end="url(#ar)"/>
<path class="flow" d="M460 466 V496" marker-end="url(#ar)"/>
<path class="flow" d="M460 568 V598" marker-end="url(#ar)"/>
<path class="flow" d="M460 666 V700" marker-end="url(#ar)"/>

<path class="trig" d="M600 120 C 660 150, 660 200, 602 222" marker-end="url(#art)"/>
<path class="trig" d="M600 250 C 690 290, 690 470, 602 520" marker-end="url(#art)"/>
<path class="trig" d="M600 440 C 700 470, 700 500, 602 524" marker-end="url(#art)"/>

<defs>
<marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#9aa3ad"/></marker>
<marker id="art" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#c98a2b"/></marker>
</defs>

<text x="24" y="790" class="s">Settings that are config/echo only (not in this live loop): tenant theme · venue map · Gate-A understanding · dashboard insights.</text>
<text x="700" y="715" class="s" font-style="italic">webhook</text>
<text x="700" y="728" class="s" font-style="italic">triggers ⟳</text>
</svg>
