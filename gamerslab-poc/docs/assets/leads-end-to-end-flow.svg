<svg viewBox="0 0 940 1430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
<title>GamersLab leads — end-to-end flow with inputs and outputs</title>
<desc>From discovery trigger through mine, score, enrich, draft, two human gates, send, reply and learn — with the data in and out of each stage.</desc>
<rect x="0" y="0" width="940" height="1430" fill="#ffffff"/>
<style>
.t{fill:#1a1a1a;font-size:12.5px;font-weight:700;}
.s{fill:#555;font-size:10px;}
.io{fill:#444;font-size:9.5px;}
.mono{font-family:ui-monospace,monospace;fill:#555;font-size:9px;}
.ph{fill:#888;font-size:10.5px;font-weight:700;letter-spacing:1px;}
.eng{fill:#e9f7ee;stroke:#3fa66a;stroke-width:1.5;}
.ui{fill:#eef4fb;stroke:#5b8def;stroke-width:1.5;}
.snd{fill:#e6f5f5;stroke:#3fa6a6;stroke-width:1.5;}
.bk{fill:#f1f1f1;stroke:#9aa3ad;stroke-width:1.4;}
.flow{stroke:#9aa3ad;stroke-width:2;fill:none;}
.trig{stroke:#c98a2b;stroke-width:1.5;fill:none;stroke-dasharray:4 3;}
.hdL{fill:#3a7d44;font-size:10.5px;font-weight:700;}
.hdR{fill:#2d6aa3;font-size:10.5px;font-weight:700;}
</style>

<text x="24" y="26" class="t" font-size="15">LEADS — end-to-end flow (Steam → inbox → reply), with inputs &amp; outputs</text>
<text x="24" y="43" class="s">green = v10 engine ① · blue = UI / human gate · teal = Send ②/Reply ③ · grey = backlog. Left of box = inputs · right = outputs.</text>
<text x="44" y="62" class="hdL">INPUTS →</text>
<text x="648" y="62" class="hdR">→ OUTPUTS</text>

<text x="24" y="86" class="ph">TRIGGER</text>
<rect x="300" y="74" width="330" height="56" rx="9" class="ui"/>
<text x="314" y="96" class="t">1 · Start a run</text>
<text x="314" y="112" class="s">daily 09:00 schedule · or UI "Find leads" → `discovery`</text>
<text x="314" y="125" class="mono">POST /webhook/gamerslab-discovery</text>
<text x="288" y="98" class="io" text-anchor="end">run params (opt):</text>
<text x="288" y="111" class="io" text-anchor="end">target/budget/floor</text>
<text x="642" y="98" class="mono">runs row (status=running)</text>
<text x="642" y="111" class="mono">webhook fired → engine</text>

<text x="24" y="156" class="ph">ENGINE ① · MINE</text>
<rect x="300" y="146" width="330" height="50" rx="9" class="eng"/>
<text x="314" y="166" class="t">2 · Get exclusion set + CAG</text>
<text x="314" y="182" class="s">already-drafted ids; load the brief</text>
<text x="288" y="166" class="io" text-anchor="end">publishers (drafted)</text>
<text x="288" y="179" class="io" text-anchor="end">cag_context</text>
<text x="642" y="166" class="mono">exclusion set</text>
<text x="642" y="179" class="mono">CAG brief in-memory</text>

<rect x="300" y="206" width="330" height="46" rx="9" class="eng"/>
<text x="314" y="225" class="t">3 · Mine SteamSpy</text>
<text x="314" y="240" class="s">1 genre tag, rotated hourly across 8</text>
<text x="288" y="226" class="io" text-anchor="end">SteamSpy top list</text>
<text x="642" y="232" class="mono">candidate games</text>

<rect x="300" y="262" width="330" height="50" rx="9" class="eng"/>
<text x="314" y="282" class="t">4 · Pick 100 publishers</text>
<text x="314" y="298" class="s">drop majors · score · game→publisher hop</text>
<text x="288" y="288" class="io" text-anchor="end">candidate games</text>
<text x="642" y="282" class="mono">top TARGET_COUNT (100)</text>
<text x="642" y="295" class="mono">publishers</text>

<rect x="300" y="322" width="330" height="52" rx="9" class="eng"/>
<text x="314" y="342" class="t">5 · Steam details → extract → filter</text>
<text x="314" y="358" class="s">rate-limited; drop delisted / no-data</text>
<text x="288" y="342" class="io" text-anchor="end">Steam API</text>
<text x="288" y="355" class="io" text-anchor="end">(per app)</text>
<text x="642" y="342" class="mono">facts, signals,</text>
<text x="642" y="355" class="mono">support_email, game_phase</text>

<text x="24" y="396" class="ph">SCORE</text>
<rect x="300" y="384" width="330" height="52" rx="9" class="eng"/>
<text x="314" y="404" class="t">6 · Pre-Score (generic budget pre-filter)</text>
<text x="314" y="420" class="s">review-volume/sentiment; no Steam fit weights</text>
<text x="288" y="404" class="io" text-anchor="end">review volume</text>
<text x="642" y="404" class="mono">pre_score + tier band</text>
<text x="642" y="417" class="mono">(real fit = LLM, step 9)</text>

<rect x="300" y="446" width="330" height="58" rx="9" class="eng"/>
<text x="314" y="466" class="t">7 · Select &amp; Split (budget gate)</text>
<text x="314" y="482" class="s">per-publisher dedup; spend the daily budget</text>
<text x="314" y="496" class="mono">DRAFT_BUDGET=35 · SCORE_FLOOR=10</text>
<text x="288" y="468" class="io" text-anchor="end">scored candidates</text>
<text x="642" y="466" class="mono">enrich set (best)</text>
<text x="642" y="479" class="mono">+ backlog set →</text>

<rect x="660" y="500" width="250" height="44" rx="9" class="bk"/>
<text x="672" y="520" class="t" font-size="11">Backlog (parked)</text>
<text x="672" y="535" class="mono">Upsert Backlog · no draft · no spend</text>

<text x="24" y="560" class="ph">ENRICH</text>
<text x="24" y="574" class="s">(batched,</text>
<text x="24" y="586" class="s">1 at a time)</text>
<rect x="300" y="516" width="330" height="118" rx="9" class="eng"/>
<text x="314" y="536" class="t">8 · Enrich the publisher</text>
<text x="314" y="553" class="s">Exa search (primary) → SerpAPI fallback</text>
<text x="314" y="568" class="s">→ website + contact-page scrape</text>
<text x="314" y="583" class="s">→ Merge (email waterfall + socials)</text>
<text x="314" y="598" class="s">→ Verify Email (MX) → Classify</text>
<text x="314" y="620" class="mono">no WHOIS (removed); socials from search links</text>
<text x="288" y="540" class="io" text-anchor="end">publisher name</text>
<text x="288" y="553" class="io" text-anchor="end">/ domain</text>
<text x="642" y="556" class="mono">contact_email(_all)</text>
<text x="642" y="569" class="mono">twitter/linkedin/discord</text>
<text x="642" y="582" class="mono">founder, intel, evidence</text>
<text x="642" y="595" class="mono">email_valid + status</text>

<text x="24" y="664" class="ph">DRAFT</text>
<rect x="300" y="646" width="330" height="64" rx="9" class="eng"/>
<text x="314" y="666" class="t">9 · Apply CAG → LLM draft → fit-gate</text>
<text x="314" y="682" class="s">config-driven cheap model(s); 1 per lead</text>
<text x="314" y="698" class="s">LLM fit_score gates the board (weak → skip)</text>
<text x="288" y="660" class="io" text-anchor="end">enriched lead</text>
<text x="288" y="673" class="io" text-anchor="end">+ BUSINESS BRIEF</text>
<text x="288" y="686" class="io" text-anchor="end">+ model chain</text>
<text x="642" y="664" class="mono">draft_subject / body, fit_score</text>
<text x="642" y="677" class="mono">intel, founder_quote</text>
<text x="642" y="690" class="mono">evidence_strength, risk_flags</text>

<rect x="300" y="720" width="330" height="58" rx="9" class="eng"/>
<text x="314" y="740" class="t">10 · Build record → Add B → Upsert</text>
<text x="314" y="756" class="s">assemble row + a 2nd (B) subject variant</text>
<text x="314" y="770" class="mono">upsert on steam_app_id</text>
<text x="288" y="742" class="io" text-anchor="end">final fields</text>
<text x="642" y="742" class="mono">publishers (status=draft)</text>
<text x="642" y="755" class="mono">message rows (A + B)</text>
<text x="642" y="768" class="mono">runs → progress 100</text>

<text x="24" y="804" class="ph">GATE B · human</text>
<rect x="300" y="792" width="330" height="58" rx="9" class="ui"/>
<text x="314" y="812" class="t">11 · Review leads</text>
<text x="314" y="828" class="s">UI Gate B → `leads`; approve / reject</text>
<text x="314" y="842" class="mono">PATCH /leads/:id {status, reasonCode}</text>
<text x="288" y="814" class="io" text-anchor="end">publishers</text>
<text x="288" y="827" class="io" text-anchor="end">(status=draft)</text>
<text x="642" y="814" class="mono">approved | rejected</text>
<text x="642" y="827" class="mono">(+ reject_reason_code)</text>

<text x="24" y="876" class="ph">GATE C · human</text>
<rect x="300" y="862" width="330" height="62" rx="9" class="ui"/>
<text x="314" y="882" class="t">12 · Approve outreach</text>
<text x="314" y="898" class="s">UI Gate C shows A/B variants; pick + approve</text>
<text x="314" y="913" class="mono">POST /outreach/:id/approve</text>
<text x="288" y="886" class="io" text-anchor="end">approved leads</text>
<text x="288" y="899" class="io" text-anchor="end">message A/B</text>
<text x="642" y="886" class="mono">approved_subject/body</text>
<text x="642" y="899" class="mono">fires gamerslab-send →</text>

<text x="24" y="950" class="ph">SEND ②</text>
<rect x="300" y="936" width="330" height="66" rx="9" class="snd"/>
<text x="314" y="956" class="t">13 · Outreach Send</text>
<text x="314" y="972" class="s">get draft → token broker → build MIME → Gmail</text>
<text x="314" y="988" class="mono">stamp sent_at + thread_id</text>
<text x="288" y="958" class="io" text-anchor="end">message draft</text>
<text x="288" y="971" class="io" text-anchor="end">contact_email</text>
<text x="288" y="984" class="io" text-anchor="end">Gmail OAuth token</text>
<text x="642" y="962" class="mono">email sent (real)</text>
<text x="642" y="975" class="mono">publishers+message=sent</text>

<text x="24" y="1028" class="ph">REPLY ③</text>
<rect x="300" y="1014" width="330" height="62" rx="9" class="snd"/>
<text x="314" y="1034" class="t">14 · Reply Poll (every 15 min)</text>
<text x="314" y="1050" class="s">read thread → inbound if From ≠ inbox</text>
<text x="314" y="1064" class="mono">stamp replied_at</text>
<text x="288" y="1038" class="io" text-anchor="end">sent threads</text>
<text x="288" y="1051" class="io" text-anchor="end">(status=sent)</text>
<text x="642" y="1038" class="mono">publishers+message</text>
<text x="642" y="1051" class="mono">= replied</text>

<text x="24" y="1102" class="ph">LEARN</text>
<rect x="300" y="1088" width="330" height="66" rx="9" class="ui"/>
<text x="314" y="1108" class="t">15 · Track + learn</text>
<text x="314" y="1124" class="s">prospect board: New/Contacted/Replied/Won/Lost</text>
<text x="314" y="1139" class="s">won/lost persists; follow-up step-2 in-thread</text>
<text x="288" y="1110" class="io" text-anchor="end">reply +</text>
<text x="288" y="1123" class="io" text-anchor="end">outcome state</text>
<text x="642" y="1110" class="mono">outcomes on message</text>
<text x="642" y="1123" class="mono">+ publishers</text>
<text x="642" y="1136" class="mono">(→ scoring/CAG = roadmap)</text>

<path class="flow" d="M465 130 V146" marker-end="url(#a2)"/>
<path class="flow" d="M465 196 V206" marker-end="url(#a2)"/>
<path class="flow" d="M465 252 V262" marker-end="url(#a2)"/>
<path class="flow" d="M465 312 V322" marker-end="url(#a2)"/>
<path class="flow" d="M465 374 V384" marker-end="url(#a2)"/>
<path class="flow" d="M465 436 V446" marker-end="url(#a2)"/>
<path class="flow" d="M465 504 V516" marker-end="url(#a2)"/>
<path class="flow" d="M465 634 V646" marker-end="url(#a2)"/>
<path class="flow" d="M465 710 V720" marker-end="url(#a2)"/>
<path class="flow" d="M465 778 V792" marker-end="url(#a2)"/>
<path class="flow" d="M465 850 V862" marker-end="url(#a2)"/>
<path class="flow" d="M465 924 V936" marker-end="url(#a2)"/>
<path class="flow" d="M465 1002 V1014" marker-end="url(#a2)"/>
<path class="flow" d="M465 1076 V1088" marker-end="url(#a2)"/>
<path class="flow" d="M630 478 H645 V522 H660" marker-end="url(#a2)"/>

<defs>
<marker id="a2" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#9aa3ad"/></marker>
</defs>

<text x="24" y="1200" class="s">Gates are hard human stops: nothing drafts past Gate B without approval, nothing sends past Gate C. The engine never sends — only ② does, post-approval.</text>
<text x="24" y="1218" class="s">CAG brief at step 9 comes from the CLIENT intelligence loop (separate diagram). Backlog rows can be promoted to a future run by a human.</text>
</svg>
