<svg viewBox="0 0 900 880" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Lead-gen business process, five stages">
<title>Lead-Gen Business Process — five stages (v10, incorporating v9 learnings)</title>
<rect x="0" y="0" width="900" height="880" fill="#ffffff"/>
<style>
.t{fill:#1f1d1a}.s{fill:#6b6660}.i{fill:#3552a4}
.band{fill:#f4f3ef;stroke:#d8d4ca;stroke-width:1.5}
.chip{fill:#ffffff;stroke:#e0dccf;stroke-width:1}
.star{fill:#ffffff;stroke:#3552a4;stroke-width:1.5}
.gate{fill:#ffffff;stroke:#3552a4;stroke-width:1.5;stroke-dasharray:5 3}
.ven{fill:#ffffff;stroke:#cfc8ba;stroke-width:1}
.h{font-size:13px;font-weight:700}.lbl{font-size:11.5px;font-weight:600}
.sub{font-size:10px}.tag{font-size:9.5px;font-weight:600}
.ar{stroke:#b3aca0;stroke-width:1.6;fill:none}
</style>
<defs>
<marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#b3aca0"/></marker>
<marker id="al" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3552a4"/></marker>
</defs>

<text x="28" y="30" class="t h" font-size="17">Lead-Gen Business Process — the work, before the tooling</text>
<text x="28" y="50" class="s sub" font-size="11">DRAFT v10 · folds in the proven v9 outreach pipeline · 🤖 agent · 👤 human gate · ★ the differentiator</text>

<!-- STAGE 1 -->
<rect x="240" y="64" width="500" height="76" rx="9" class="band"/>
<text x="254" y="84" class="t h">1 · CLIENT BUSINESS DISCOVERY</text>
<rect x="254" y="92" width="232" height="38" rx="6" class="chip"/>
<text x="264" y="108" class="t lbl">1.1 Understand the client</text>
<text x="264" y="123" class="s sub">problem solved · product · ICP</text>
<rect x="496" y="92" width="232" height="38" rx="6" class="chip"/>
<text x="506" y="108" class="t lbl">1.2 Map the venues</text>
<text x="506" y="123" class="s sub">where customers congregate</text>

<!-- GATE A -->
<rect x="240" y="150" width="500" height="28" rx="7" class="gate"/>
<text x="254" y="168" class="i lbl">👤 GATE A · client confirms profile + venue map</text>

<!-- VENUES cluster -->
<rect x="28" y="192" width="186" height="232" rx="9" class="band"/>
<text x="42" y="212" class="t lbl" font-size="11">VENUES (the map)</text>
<text x="42" y="226" class="s sub">mine where they are →</text>
<g class="ven">
<rect x="42" y="234" width="158" height="20" rx="5"/><rect x="42" y="258" width="158" height="20" rx="5"/>
<rect x="42" y="282" width="158" height="20" rx="5"/><rect x="42" y="306" width="158" height="20" rx="5"/>
<rect x="42" y="330" width="158" height="20" rx="5"/></g>
<text x="50" y="248" class="t sub">Steam / SteamSpy</text>
<text x="50" y="272" class="t sub">Reddit · Discord</text>
<text x="50" y="296" class="t sub">GitHub · forums</text>
<text x="50" y="320" class="t sub">Web — Exa Websets</text>
<text x="50" y="344" class="t sub">…or alt path if closed</text>
<text x="42" y="372" class="i tag">pluggable adapters</text>
<text x="42" y="392" class="s sub">Exa = web/identity</text>
<text x="42" y="406" class="s sub">engine (replaces v9</text>
<text x="42" y="420" class="s sub">Serper + WHOIS)</text>

<!-- STAGE 2 -->
<rect x="240" y="192" width="500" height="232" rx="9" class="band"/>
<text x="254" y="212" class="t h">2 · DATA &amp; LEAD DISCOVERY</text>
<rect x="254" y="220" width="474" height="24" rx="6" class="chip"/>
<text x="264" y="236" class="t lbl">2.1 Mine venue → entity hop <tspan class="s sub">· e.g. SteamSpy games → publishers</tspan></text>
<rect x="254" y="248" width="474" height="24" rx="6" class="chip"/>
<text x="264" y="264" class="t lbl">2.2 Enrich 360° <tspan class="s sub">· Exa contents + enrichments: site, socials, founders, contacts</tspan></text>
<rect x="254" y="276" width="474" height="24" rx="6" class="star"/>
<text x="264" y="292" class="t lbl">★ 2.3 Verify the painpoint <tspan class="s sub">· cited evidence — the moat</tspan></text>
<rect x="254" y="304" width="474" height="24" rx="6" class="chip"/>
<text x="264" y="320" class="t lbl">2.4 Two-stage score <tspan class="s sub">· cheap pre-score GATE → full fit_score (value × match)</tspan></text>
<rect x="254" y="332" width="474" height="24" rx="6" class="chip"/>
<text x="264" y="348" class="t lbl">2.5 Verify + classify email <tspan class="s sub">· deliverable? role vs personal? (from v9)</tspan></text>
<rect x="254" y="360" width="474" height="24" rx="6" class="chip"/>
<text x="264" y="376" class="t lbl">2.6 Build discovery packs <tspan class="s sub">· dossier + evidence + angle + sources</tspan></text>
<rect x="254" y="388" width="474" height="24" rx="6" class="chip"/>
<text x="264" y="404" class="t lbl">2.7 Backlog + dedup <tspan class="s sub">· persistent queue · skip "already drafted" across runs</tspan></text>

<!-- GATE B -->
<rect x="240" y="434" width="500" height="28" rx="7" class="gate"/>
<text x="254" y="452" class="i lbl">👤 GATE B · client approves / rejects leads (evidence shown)</text>

<!-- STAGE 3 -->
<rect x="240" y="474" width="500" height="56" rx="9" class="band"/>
<text x="254" y="494" class="t h">3 · REACH OUT</text>
<rect x="254" y="500" width="474" height="24" rx="6" class="chip"/>
<text x="264" y="516" class="t lbl">3.1 Grounded material, multi-model <tspan class="s sub">· draft across free models → pick best · NO send</tspan></text>

<!-- STAGE 4 -->
<rect x="240" y="542" width="500" height="56" rx="9" class="band"/>
<text x="254" y="562" class="t h">4 · PROSPECT TRACKING</text>
<rect x="254" y="568" width="474" height="24" rx="6" class="chip"/>
<text x="264" y="584" class="t lbl">4.1 Track state <tspan class="s sub">· contacted → replied → success / partial / fail</tspan></text>

<!-- STAGE 5 -->
<rect x="240" y="610" width="500" height="56" rx="9" class="band"/>
<text x="254" y="630" class="t h">5 · LEARN &amp; ITERATE</text>
<rect x="254" y="636" width="474" height="24" rx="6" class="chip"/>
<text x="264" y="652" class="t lbl">5.1 Outcomes → client's prompts &amp; skills <tspan class="s sub">+ scoring + venue map</tspan></text>

<!-- vertical arrows -->
<g class="ar" marker-end="url(#a)">
<path d="M490,140 L490,149"/>
<path d="M490,178 L490,191"/>
<path d="M490,424 L490,433"/>
<path d="M490,462 L490,473"/>
<path d="M490,530 L490,541"/>
<path d="M490,598 L490,609"/>
</g>
<path d="M214,250 C232,250 232,232 252,232" class="ar" marker-end="url(#a)"/>

<!-- LEARN loop back -->
<path d="M740,636 C824,600 824,270 740,232" fill="none" stroke="#3552a4" stroke-width="1.6" marker-end="url(#al)"/>
<text x="760" y="445" class="i tag">compounds</text>
<text x="760" y="459" class="i tag">per client</text>

<text x="28" y="710" class="s sub" font-size="10.5">v9 learnings folded in (2.1 entity hop, 2.4 pre-score gate, 2.5 email verify/classify, 2.7 backlog dedup, 3.1 multi-model pick-best).</text>
<text x="28" y="727" class="s sub" font-size="10.5">Exa Websets is the discovery/enrichment engine (replacing v9's Serper + WHOIS + raw scraping). Gates, tracking + learn loop are net-new vs v9.</text>
</svg>
