<svg viewBox="0 0 1080 720" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="v2 data model ERD">
<title>v2 data model — entity relationships</title>
<rect x="0" y="0" width="1080" height="720" fill="#ffffff"/>
<style>
.t{fill:#1f1d1a}.s{fill:#6b6660}.i{fill:#3552a4}.k{fill:#2f6f62}
.tbl{fill:#ffffff;stroke:#d8d4ca;stroke-width:1.5}
.hub{fill:#eef4f1;stroke:#2f6f62;stroke-width:2}
.hdr{font-size:11.5px;font-weight:700}.col{font-size:9.4px}.note{font-size:10px}
.rel{stroke:#8aa0d8;stroke-width:1.7;fill:none}
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8aa0d8"/></marker></defs>

<text x="28" y="28" class="t hdr" font-size="15">v2 Data Model — ERD (greenfield)</text>
<text x="28" y="46" class="s note">Every table carries <tspan class="k">tenant_id → tenant(id)</tspan> (FK); RLS scopes by tenant_id. Only non-tenant relationships drawn below.</text>

<!-- tenant hub -->
<rect x="32" y="64" width="200" height="96" rx="8" class="hub"/>
<text x="44" y="84" class="t hdr">tenant</text>
<text x="44" y="102" class="k col">id (PK)</text><text x="44" y="116" class="s col">name</text><text x="44" y="130" class="s col">theme jsonb (white-label)</text><text x="44" y="144" class="s col">mode customers|investors</text>

<rect x="262" y="64" width="190" height="96" rx="8" class="tbl"/>
<text x="274" y="84" class="t hdr">app_user</text>
<text x="274" y="102" class="k col">id (PK)</text><text x="274" y="116" class="s col">tenant_id (FK)</text><text x="274" y="130" class="s col">role owner|member</text><text x="274" y="146" class="s col">(used when auth lands)</text>

<rect x="482" y="64" width="180" height="96" rx="8" class="tbl"/>
<text x="494" y="84" class="t hdr">intake</text>
<text x="494" y="102" class="k col">tenant_id (PK/FK)</text><text x="494" y="116" class="s col">offer · icp · outcome</text><text x="494" y="130" class="s col">leads_today</text><text x="494" y="144" class="s col">good_lead</text>

<rect x="692" y="64" width="180" height="96" rx="8" class="tbl"/>
<text x="704" y="84" class="t hdr">venue</text>
<text x="704" y="102" class="k col">id (PK)</text><text x="704" y="116" class="s col">name · platform</text><text x="704" y="130" class="s col">strength · enabled</text><text x="704" y="144" class="s col">access_method</text>

<rect x="900" y="64" width="150" height="96" rx="8" class="tbl"/>
<text x="912" y="84" class="t hdr">business_summary</text>
<text x="912" y="102" class="k col">tenant_id (PK/FK)</text><text x="912" y="116" class="s col">summary·icp·pains</text><text x="912" y="130" class="s col">channel · confidence</text><text x="912" y="144" class="s col">confirmed (Gate A)</text>

<!-- source -> document -->
<rect x="32" y="200" width="190" height="92" rx="8" class="tbl"/>
<text x="44" y="220" class="t hdr">source</text>
<text x="44" y="238" class="k col">id (PK)</text><text x="44" y="252" class="s col">type file|url|social</text><text x="44" y="266" class="s col">storage_path</text><text x="44" y="280" class="s col">parsing · done</text>

<rect x="300" y="200" width="210" height="92" rx="8" class="tbl"/>
<text x="312" y="220" class="t hdr">document  (RAG)</text>
<text x="312" y="238" class="k col">id (PK)</text><text x="312" y="252" class="s col">source_id (FK)</text><text x="312" y="266" class="s col">chunk_index · body</text><text x="312" y="280" class="k col">embedding vector(384) · HNSW</text>

<path d="M222,246 L300,246" class="rel" marker-end="url(#a)"/><text x="232" y="240" class="s col">1:N</text>

<!-- run, outcome top right area -->
<rect x="560" y="200" width="220" height="92" rx="8" class="tbl"/>
<text x="572" y="220" class="t hdr">run  (discovery job)</text>
<text x="572" y="238" class="k col">id (PK)</text><text x="572" y="252" class="s col">status queued→running→done/fail</text><text x="572" y="266" class="s col">progress · counts jsonb</text><text x="572" y="280" class="s col">error · started/finished_at</text>

<rect x="820" y="200" width="230" height="92" rx="8" class="tbl"/>
<text x="832" y="220" class="t hdr">model_call_log</text>
<text x="832" y="238" class="k col">id (PK)</text><text x="832" y="252" class="s col">path client_key|free</text><text x="832" y="266" class="s col">model · tokens · cost</text><text x="832" y="280" class="s col">at</text>

<!-- lead center -->
<rect x="32" y="360" width="250" height="170" rx="8" class="hub"/>
<text x="44" y="382" class="t hdr">lead</text>
<text x="44" y="400" class="k col">id (PK)</text>
<text x="44" y="414" class="s col">entity_type company|person|investor</text>
<text x="44" y="428" class="k col">external_key  · unique(tenant,key)</text>
<text x="44" y="442" class="s col">name · initials</text>
<text x="44" y="456" class="s col">score · value_score · match_score</text>
<text x="44" y="470" class="s col">verified · reason · source_url · meta</text>
<text x="44" y="484" class="s col">email · email_status</text>
<text x="44" y="498" class="s col">status pending|approved|rejected</text>
<text x="44" y="516" class="s col">venue</text>

<!-- evidence, outreach, outcome -->
<rect x="340" y="360" width="220" height="120" rx="8" class="tbl"/>
<text x="352" y="380" class="t hdr">evidence  (Gate B dossier)</text>
<text x="352" y="398" class="k col">id (PK)</text><text x="352" y="412" class="s col">lead_id (FK, cascade)</text><text x="352" y="426" class="s col">quote</text><text x="352" y="440" class="s col">src · date_label</text><text x="352" y="454" class="s col">url  (Exa cited reference)</text>

<rect x="600" y="360" width="220" height="120" rx="8" class="tbl"/>
<text x="612" y="380" class="t hdr">outreach  (Gate C)</text>
<text x="612" y="398" class="k col">id (PK)</text><text x="612" y="412" class="s col">lead_id (FK)</text><text x="612" y="426" class="s col">channel</text><text x="612" y="440" class="s col">stage awaiting→…→lost</text><text x="612" y="454" class="s col">draft · last_event</text>

<rect x="860" y="360" width="190" height="120" rx="8" class="tbl"/>
<text x="872" y="380" class="t hdr">outcome  (learn)</text>
<text x="872" y="398" class="k col">id (PK)</text><text x="872" y="412" class="s col">lead_id (FK)</text><text x="872" y="426" class="s col">state</text><text x="872" y="440" class="s col">note</text><text x="872" y="454" class="s col">created_at</text>

<g class="rel" marker-end="url(#a)">
<path d="M282,400 L340,400"/>   <!-- lead -> evidence -->
<path d="M282,430 C500,430 560,420 600,420"/>  <!-- lead -> outreach -->
<path d="M282,460 C520,500 820,440 860,430"/>  <!-- lead -> outcome -->
</g>
<text x="292" y="394" class="s col">1:N</text>

<text x="28" y="580" class="s note">PK = primary key · FK = foreign key · all FKs to tenant(id) omitted for clarity (every table has tenant_id).</text>
<text x="28" y="600" class="s note">Idempotency: lead.external_key unique per tenant (dedup); run.id, source.id, Exa externalId.</text>
<text x="28" y="620" class="s note">Vectors: document.embedding = gte-small vector(384), HNSW cosine index; retrieval via match_documents(query, tenant, threshold, count).</text>
</svg>
